    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            /* Friendly Theme Variables */
            --primary: #4A90E2;       /* Soft Royal Blue */
            --primary-dark: #357ABD;
            --secondary: #FFD700;     /* Gold Accent */
            --bg-body: #f4f7f6;       /* Very light grey/blue tint */
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 15px 35px rgba(74, 144, 226, 0.15);
            --radius: 20px;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-touch-callout: none;
        }

        .hero-section {
            background: linear-gradient(135deg, #4A90E2 0%, #00d2ff 100%);
            padding: 80px 0 60px;
            text-align: center;
            color: white;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.3);
            margin-bottom: 40px;
        }

        .hero-title {
            font-weight: 700;
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-weight: 300;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        @media (max-width: 576px) {
            .hero-section {
                padding: 50px 0 40px;
                margin-bottom: 30px;
            }

            .hero-subtitle {
                font-size: 0.95rem;
            }
        }

        /* --- Navigation --- */
        .nav-pills-custom {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: -30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        @media (max-width: 576px) {
            .nav-pills-custom {
                gap: 10px;
                margin-top: -25px;
                margin-bottom: 30px;
            }
        }

        .nav-btn {
            background: white;
            color: var(--primary);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .nav-btn:hover,
        .nav-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            color: var(--primary-dark);
        }

        @media (max-width: 576px) {
            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        /* --- Cards --- */
        .profile-card {
            background: var(--card-bg);
            border: none;
            border-radius: var(--radius);
            padding: 25px;
            height: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .profile-card:hover,
        .profile-card:active {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        @media (max-width: 576px) {
            .profile-card {
                padding: 20px;
            }
        }

        .card-top-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), #00d2ff);
        }

        /* --- Header in Card --- */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f6f8fb, #e2e6ea);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .profile-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .gender-badge {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* --- Pills & Tags --- */
        .badge-pill {
            background: rgba(74, 144, 226, 0.1);
            color: var(--primary);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 5px;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* --- Info Grid --- */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 45%;
        }

        .info-content {
            color: var(--text-dark);
            font-weight: 500;
            text-align: right;
            width: 55%;
            word-break: break-word;
        }

        /* --- Special Highlights --- */
        .contact-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            min-height: 44px;
        }
        
        .contact-row i { color: var(--primary); width: 20px; text-align: center;}

        .achievement-box {
            margin-top: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #fff9e6 0%, #fff 100%);
            border: 1px solid #ffeeba;
            border-radius: 12px;
        }
        
        .achievement-title {
            color: #d4ac0d;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        /* --- Search --- */
        .search-container {
            background: white;
            border-radius: 50px;
            padding: 5px 25px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            border: 1px solid #eee;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-dark);
            padding: 15px;
            width: 100%;
            font-size: 1rem;
        }

        .search-container input:focus { outline: none; }

        @media (max-width: 576px) {
            .search-container {
                padding: 5px 15px;
                margin-bottom: 30px;
            }

            .search-container input {
                padding: 12px;
                font-size: 16px;
            }
        }

        /* --- Footer --- */
        footer {
            margin-top: 80px;
            padding: 40px 0;
            background: white;
            text-align: center;
            border-top: 1px solid #eee;
        }

        /* Analytics Cards */
        .chart-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            height: 100%;
        }
    </style>
</head>

        document.getElementById('totalCount').innerText = profiles.length;

        // --- CALCULATE ANALYTICS DYNAMICALLY ---
        
        // 1. Gender Stats
        let femaleCount = profiles.filter(p => p.Gender.trim().toLowerCase() === 'female').length;
        let maleCount = profiles.filter(p => p.Gender.trim().toLowerCase() === 'male').length;

        // 2. Preference Stats (Counting individual tags)
        let prefCounts = { Coaching: 0, Playing: 0, Arbitering: 0 };
        profiles.forEach(p => {
            if(p.Preferences.includes('Coaching')) prefCounts.Coaching++;
            if(p.Preferences.includes('Playing')) prefCounts.Playing++;
            if(p.Preferences.includes('Arbitering')) prefCounts.Arbitering++;
        });

        // 3. Theory Stats
        let theoryCounts = {};
        profiles.forEach(p => {
            let t = p.Theory.split(',')[0].trim(); // Take first part if comma exists
            if (t.includes('Improve')) t = 'Needs Imp.';
            theoryCounts[t] = (theoryCounts[t] || 0) + 1;
        });

        // 4. School Stats
        let schoolCounts = {};
        profiles.forEach(p => {
            let s = p.School.replace('College', '').replace('Vidyalaya', '').replace('Girls\' School', '').replace(/[^a-zA-Z ]/g, "").trim();
            // Simple mapping for cleaner chart
            if(s.includes('Anula')) s = 'Anula';
            else if(s.includes('Dharmapala')) s = 'Dharmapala';
            else if(s.includes('Sirimavo')) s = 'Sirimavo';
            else if(s.includes('Yasodara')) s = 'Yasodara';
            else if(s.includes('Ananda')) s = 'Ananda Sas.';
            else if(s.includes('President')) s = 'President\'s';
            else if(s.includes('Mahanama')) s = 'Mahanama';
            else if(s.includes('Lindsay')) s = 'Lindsay';
            
            schoolCounts[s] = (schoolCounts[s] || 0) + 1;

                                </div>
                            </div>

                            <div class="achievement-box">
                                <span class="achievement-title"><i class="fas fa-trophy me-1"></i> Highest Achievement</span>
                                <div class="text-dark small">${p['Achievement']}</div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        renderProfiles(profiles);

        function filterProfiles() {
            const query = document.getElementById('memberSearch').value.toLowerCase();
            const filtered = profiles.filter(p => Object.values(p).some(val => String(val).toLowerCase().includes(query)));
            renderProfiles(filtered);
        }

        window.onresize = function() {
            const plots = ['genderPlot', 'prefPlot', 'schoolPlot', 'theoryPlot'];
            plots.forEach(id => Plotly.Plots.resize(id));
        };
    </script>
</body>
</html>
