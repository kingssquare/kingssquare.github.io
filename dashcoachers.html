<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .profile-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .profile-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
    </style>
</head>
<body class="antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i class="fas fa-chess-king text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">KSCA Improvement Portal</h1>
            </div>
            <div class="relative hidden md:block">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="globalSearch" placeholder="Search by name..." 
                       class="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:ring-2 focus:ring-blue-500 outline-none w-64 transition-all">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-16">
            <div class="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold mb-6 text-slate-800 flex items-center gap-2">
                    <i class="fas fa-chart-line text-blue-500"></i> Academy Improvement Sentiment (Weighted)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="h-64"><canvas id="eduChart"></canvas></div>
                    <div class="h-64"><canvas id="assessChart"></canvas></div>
                </div>
            </div>
            <div class="bg-blue-600 p-8 rounded-[2.5rem] shadow-xl text-white flex flex-col justify-between">
                <div>
                    <h3 class="text-2xl font-bold leading-tight">Improvement<br>Metrics 2025</h3>
                    <p class="mt-4 text-blue-100 text-sm">Aggregated results from all 20 responders. Analysis shows high demand for Standard Training Programs.</p>
                </div>
                <div class="mt-8 space-y-4">
                    <div class="flex justify-between items-end border-b border-blue-500/50 pb-2">
                        <span class="text-blue-200 text-xs font-bold uppercase tracking-widest">Active Coaches</span>
                        <span class="text-3xl font-bold">17</span>
                    </div>
                    <div class="flex justify-between items-end border-b border-blue-500/50 pb-2">
                        <span class="text-blue-200 text-xs font-bold uppercase tracking-widest">FIDE Rated</span>
                        <span class="text-3xl font-bold">5</span>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Full Responder Profiles</h2>
                <div class="flex flex-wrap gap-2" id="filterButtons">
                    <button onclick="filterProfiles('All')" class="px-4 py-2 rounded-full bg-blue-600 text-white text-xs font-bold">All (20)</button>
                    <button onclick="filterProfiles('Very Good')" class="px-4 py-2 rounded-full bg-white text-slate-600 text-xs font-bold border border-slate-200">Very Good</button>
                    <button onclick="filterProfiles('Good')" class="px-4 py-2 rounded-full bg-white text-slate-600 text-xs font-bold border border-slate-200">Good</button>
                    <button onclick="filterProfiles('Normal')" class="px-4 py-2 rounded-full bg-white text-slate-600 text-xs font-bold border border-slate-200">Normal</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="profileGrid">
                </div>
        </section>
    </main>

            {"name": "Tharushi Sooriyaarachchi ", "gender": "Female", "designation": "Assistant Coach", "theory": "Need to Improve", "achievement": "National", "fide": "No", "q_assessment": ["1. An Interview", "2. Demonstration / Presentation", "3. Getting feedbacks from other members and Schools", "4. A Placement Examination", "5. A Tournament between members"], "q_education": ["1. Facilitating a Standard Training Program", "2. Providing Materials (pdf, Videos & Programs)", "3. Self studies", "4. By requesting to play tournaments"]},
            {"name": "Amodi Dewmini Dissanayake", "gender": "Female", "designation": "Assistant Coach, Junior Coach", "theory": "Very Good", "achievement": "National", "fide": "No", "q_assessment": ["1. An Interview", "2. A Placement Examination", "3. Demonstration / Presentation", "4. A Tournament between members", "5. Getting feedbacks from other members and Schools"], "q_education": ["1. Providing Materials (pdf, Videos & Programs)", "2. Facilitating a Standard Training Program", "3. By requesting to play tournaments", "4. Self studies"]},
            {"name": "Yoshan", "gender": "Male", "designation": "Assistant Coach", "theory": "Normal", "achievement": "Zonal", "fide": "No", "q_assessment": ["1. Demonstration / Presentation", "2. Getting feedbacks from other members and Schools"], "q_education": ["1. Self studies", "2. Providing Materials (pdf, Videos & Programs)", "3. Facilitating a Standard Training Program"]}
        ];

        function renderProfiles(list) {
            const grid = document.getElementById('profileGrid');
            grid.innerHTML = list.map(p => `
                <div class="profile-card bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-8">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-white ${p.gender === 'Female' ? 'bg-pink-400' : 'bg-blue-400'}">${p.name.charAt(0)}</div>
                            <div><h4 class="font-bold text-slate-900">${p.name}</h4><p class="text-[10px] uppercase font-bold text-slate-400">${p.designation}</p></div>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <p class="text-[10px] font-bold text-blue-600 uppercase mb-2">Q: Recommended Skill Recognition?</p>
                                <div class="text-[11px] text-slate-600 space-y-1 bg-blue-50/50 p-3 rounded-xl">
                                    ${p.q_assessment.map(ans => `<div>• ${ans}</div>`).join('')}
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-emerald-600 uppercase mb-2">Q: Preferred Education Process?</p>
                                <div class="text-[11px] text-slate-600 space-y-1 bg-emerald-50/50 p-3 rounded-xl">
                                    ${p.q_education.map(ans => `<div>• ${ans}</div>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            renderProfiles(profiles);
            new Chart(document.getElementById('eduChart'), { type: 'bar', data: { labels: ['Training', 'Materials', 'Self Studies', 'Tournaments'], datasets: [{ data: [60, 56, 34, 30], backgroundColor: '#3b82f6' }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
            new Chart(document.getElementById('assessChart'), { type: 'bar', data: { labels: ['Demo', 'Feedback', 'Tournament', 'Interview', 'Exam'], datasets: [{ data: [59, 54, 49, 49, 47], backgroundColor: '#10b981' }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
        };

        function filterProfiles(level) {
            if(level === 'All') renderProfiles(profiles);
            else renderProfiles(profiles.filter(p => p.theory === level));
        }

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            renderProfiles(profiles.filter(p => p.name.toLowerCase().includes(e.target.value.toLowerCase())));
        });
    </script>
</body>
</html>
